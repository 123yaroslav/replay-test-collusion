[project]
name = "collusion"
version = "0.1.0"
description = "Apart AI Collusion Research Sprint (Oct 23-25, 2026): detecting colluding LLM agents"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
